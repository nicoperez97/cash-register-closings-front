name: Deploy Frontend

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

env:
  AWS_REGION: sa-east-1
  S3_BUCKET: crc-frontend-2acfc3e0
  CLOUDFRONT_DISTRIBUTION_ID: E3D3NP6AI310D8
  ROLE_TO_ASSUME: arn:aws:iam::184658170545:role/crc-frontend-deploy
  DIST_DIR: dist/cash-register-closings-front/browser

jobs:
  build:
    name: 1 · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Instalar dependencias
        run: npm ci --no-audit --no-fund

      - name: Build producción
        run: npm run build -- --configuration production

      - name: Verificar salida del build
        run: |
          if [ ! -d "$DIST_DIR" ]; then
            echo "::error title=Build Frontend::No se encontró $DIST_DIR después del build"
            ls -la dist || true
            exit 1
          fi
          echo "Artefactos en $DIST_DIR:"
          find "$DIST_DIR" -maxdepth 2 -type f | head -40

      - name: Subir artefacto
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: ${{ env.DIST_DIR }}
          if-no-files-found: error
          retention-days: 3

      - name: Resumen
        if: always()
        run: |
          {
            echo "## 1 · Build"
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ Build de producción OK — artefacto \`frontend-dist\` listo para publicar."
            else
              echo "❌ Falló el build. Revisá **Instalar dependencias** o **Build producción**."
              echo ""
              echo "El deploy a S3/CloudFront **no** corre si esta etapa falla."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    name: 2 · Publicar (S3 + CloudFront)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Descargar artefacto
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: site

      - name: Credenciales AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync a S3
        run: |
          set -euo pipefail
          if [ ! -d site ] || [ -z "$(ls -A site)" ]; then
            echo "::error title=Deploy Frontend::El artefacto descargado está vacío"
            exit 1
          fi
          aws s3 sync site "s3://${S3_BUCKET}" --delete \
            || { echo "::error title=Deploy Frontend::aws s3 sync falló"; exit 1; }
          echo "Sync OK → s3://${S3_BUCKET}"

      - name: Invalidar CloudFront
        run: |
          set -euo pipefail
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text) \
            || { echo "::error title=Deploy Frontend::create-invalidation falló"; exit 1; }
          echo "Invalidation: $INVALIDATION_ID"
          echo "INVALIDATION_ID=$INVALIDATION_ID" >> "$GITHUB_ENV"

      - name: Resumen
        if: always()
        run: |
          {
            echo "## 2 · Publicar (S3 + CloudFront)"
            if [ "${{ job.status }}" = "success" ]; then
              echo "✅ Frontend publicado."
              echo ""
              echo "- Bucket: \`s3://${S3_BUCKET}\`"
              echo "- CloudFront: \`${CLOUDFRONT_DISTRIBUTION_ID}\`"
              if [ -n "${INVALIDATION_ID:-}" ]; then
                echo "- Invalidation: \`${INVALIDATION_ID}\`"
              fi
            else
              echo "❌ Falló la publicación."
              echo ""
              echo "Revisá el step que falló:"
              echo "1. **Descargar artefacto** — el build no generó archivos"
              echo "2. **Credenciales AWS** — OIDC / rol IAM"
              echo "3. **Sync a S3** — permisos o bucket"
              echo "4. **Invalidar CloudFront** — distribution id / permisos"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
