<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <script>
      /* Dispositivos incompatibles con Angular → versión iPad ES5 */
      (function () {
        var path = location.pathname || '';
        /* Archivo estático real. /legacy/ sin index.html cae en el SPA (Angular) y iOS 9 queda en blanco. */
        if (path.indexOf('/legacy/') === 0 && /\.(html|js|css)$/.test(path)) return;
        if (path === '/legacy/index.html' || path === '/legacy/board-r.html' || path === '/legacy/board-w.html') return;

        function iosMajor() {
          var ua = navigator.userAgent || '';
          var touchMac = navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1;
          if (!/iPad|iPhone|iPod/.test(ua) && !touchMac) return null;
          var m = ua.match(/OS (\d+)[._](\d+)/);
          if (m) return parseInt(m[1], 10);
          var v = ua.match(/Version\/(\d+)\./);
          if (v) return parseInt(v[1], 10);
          return null;
        }

        function safariMajor() {
          var ua = navigator.userAgent || '';
          if (!/Safari\//.test(ua) || /Chrome\/|CriOS\/|FxiOS\//.test(ua)) return null;
          var v = ua.match(/Version\/(\d+)\./);
          return v ? parseInt(v[1], 10) : null;
        }

        function chromeMajor() {
          var ua = navigator.userAgent || '';
          var m = ua.match(/(?:Chrome|CriOS)\/(\d+)/);
          return m ? parseInt(m[1], 10) : null;
        }

        function needsLegacy() {
          if (typeof Promise === 'undefined') return true;
          if (typeof fetch === 'undefined') return true;
          if (typeof Symbol === 'undefined') return true;
          if (!window.CSS || typeof window.CSS.supports !== 'function') return true;

          var ios = iosMajor();
          if (ios !== null && ios < 16) return true;

          var safari = safariMajor();
          if (safari !== null && safari < 16) return true;

          var chrome = chromeMajor();
          if (chrome !== null && chrome < 107) return true;

          if (/MSIE |Trident\//.test(navigator.userAgent || '')) return true;

          return false;
        }

        if (!needsLegacy()) return;

        var boardR = path.match(/^\/(?:legacy|ipad)\/r\/([^\/]+)\/?$/) || path.match(/^\/r\/([^\/]+)\/?$/);
        if (boardR) {
          location.replace(
            '/legacy/board-r.html?slug=' + encodeURIComponent(boardR[1]),
          );
          return;
        }
        var boardW = path.match(/^\/(?:legacy|ipad)\/w\/([^\/]+)\/?$/) || path.match(/^\/w\/([^\/]+)\/?$/);
        if (boardW) {
          location.replace(
            '/legacy/board-w.html?slug=' + encodeURIComponent(boardW[1]),
          );
          return;
        }

        /* Links públicos (carta, normas, reservar, etc.): nunca mandar al login legacy. */
        var publicLink = path.match(
          /^\/(n|m|p|reservar|mi-reserva)(\/[^\/]+)?\/?$/,
        );
        if (publicLink) {
          location.replace('/legacy/unsupported-public.html');
          return;
        }

        location.replace('/legacy/index.html');
      })();
    </script>
    <title>Cierres de caja</title>
    <base href="/" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
      id="app-viewport"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" id="apple-status-bar" />
    <meta name="apple-mobile-web-app-title" content="Cierres" id="apple-app-title" />
    <meta name="application-name" content="Cierres de caja" id="app-name-meta" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="color-scheme" content="light" id="app-color-scheme" />
    <meta name="theme-color" content="#1D65A0" id="app-theme-color" />
    <meta
      name="description"
      content="Cierres de caja multi-local: roles, reportes y export Excel."
      id="app-desc-meta"
    />

    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/icon-16x16.png" />
    <link rel="apple-touch-icon" href="icons/icon-180x180.png" id="apple-touch-icon" />

    <script>
      (function () {
        if (typeof fetch === 'undefined' || typeof Promise === 'undefined') return;
        /* iOS lee el primer <link rel="manifest"> que ve.
           Si el href inicial es manifest.webmanifest, cachea "Cierres" + start_url /
           aunque después lo cambiemos. Por eso el link se inyecta acá, con el href final. */
        var path = location.pathname || '';
        var isLogin = path === '/login' || path.indexOf('/login?') === 0;
        var isPublicOrdering =
          path.indexOf('/pedir/') === 0 ||
          path === '/pedir' ||
          path.indexOf('/mi-pedido/') === 0 ||
          path === '/mi-pedido';
        var manifestHref = 'manifest.webmanifest';

        /* Prefijo de ruta → kind API + títulos + esquema de status bar. */
        var PUBLIC_PAGES = [
          { re: /^\/m\/([^/]+)/, kind: 'menu', short: 'Carta', full: 'Carta', dark: false, bg: '#ffffff' },
          { re: /^\/pedir\/([^/]+)/, kind: 'ordering', short: 'Pedir', full: 'Pedir', dark: false, bg: '#eef1ee' },
          { re: /^\/mi-pedido\/([^/]+)/, kind: 'orderLookup', short: 'Mi pedido', full: 'Consultar pedido', dark: false, bg: '#eef1ee' },
          { re: /^\/mozo\/([^/]+)/, kind: 'waiter', short: 'Comanda', full: 'Comanda mozos', dark: false, bg: '#eef1ee' },
          { re: /^\/r\/([^/]+)/, kind: 'reservations', short: 'Reservas', full: 'Reservas', dark: true, bg: '#0e0c0b' },
          { re: /^\/reservar\/([^/]+)/, kind: 'reservationSignup', short: 'Reservar', full: 'Reservar', dark: true, bg: '#0e0c0b' },
          { re: /^\/mi-reserva\/([^/]+)/, kind: 'reservationLookup', short: 'Mi reserva', full: 'Consultar reserva', dark: true, bg: '#0e0c0b' },
          { re: /^\/w\/([^/]+)/, kind: 'waiting', short: 'Espera', full: 'Lista de espera', dark: true, bg: '#0e0c0b' },
          { re: /^\/p\/([^/]+)/, kind: 'attendance', short: 'Presentismo', full: 'Presentismo', dark: false, bg: '#ffffff' },
          { re: /^\/n\/([^/]+)/, kind: 'serviceRules', short: 'Normas', full: 'Normas de servicio', dark: false, bg: '#ffffff' },
        ];

        var publicPage = null;
        for (var i = 0; i < PUBLIC_PAGES.length; i++) {
          var m = path.match(PUBLIC_PAGES[i].re);
          if (m) {
            publicPage = {
              kind: PUBLIC_PAGES[i].kind,
              slug: m[1],
              short: PUBLIC_PAGES[i].short,
              full: PUBLIC_PAGES[i].full,
              dark: PUBLIC_PAGES[i].dark,
              bg: PUBLIC_PAGES[i].bg,
            };
            break;
          }
        }

        var themeMeta = document.getElementById('app-theme-color');

        if (publicPage || isLogin) {
          var statusColor = isLogin ? '#08263f' : publicPage.bg;
          if (themeMeta) themeMeta.setAttribute('content', statusColor);
          if (isLogin || (publicPage && publicPage.dark)) {
            var scheme = document.getElementById('app-color-scheme');
            if (scheme) scheme.setAttribute('content', 'dark');
            var appleBar = document.getElementById('apple-status-bar');
            if (appleBar) appleBar.setAttribute('content', 'black-translucent');
            document.documentElement.style.colorScheme = 'dark';
          }
          document.documentElement.style.backgroundColor = statusColor;
          if (document.body) document.body.style.backgroundColor = statusColor;
        }

        if (publicPage) {
          document.title = publicPage.full;
          var appleTitle = document.getElementById('apple-app-title');
          if (appleTitle) appleTitle.setAttribute('content', publicPage.short);
          var appName = document.getElementById('app-name-meta');
          if (appName) appName.setAttribute('content', publicPage.short);
          var desc = document.getElementById('app-desc-meta');
          if (desc) desc.setAttribute('content', publicPage.full);
          var qs = 'appOrigin=' + encodeURIComponent(location.origin);
          manifestHref =
            '/api/v1/public/shops/' +
            encodeURIComponent(decodeURIComponent(publicPage.slug)) +
            '/manifests/' +
            publicPage.kind +
            '?' +
            qs;
          /* Prefetch logo del local → apple-touch-icon (iOS lo lee temprano). */
          fetch(manifestHref, { credentials: 'omit', cache: 'no-store' })
            .then(function (r) {
              return r.ok ? r.json() : null;
            })
            .then(function (manifestJson) {
              if (!manifestJson || !manifestJson.icons || !manifestJson.icons.length) return;
              var icons = manifestJson.icons;
              var preferred = null;
              for (var i = 0; i < icons.length; i++) {
                if (icons[i].sizes === '180x180' && icons[i].src) {
                  preferred = icons[i].src;
                  break;
                }
              }
              var src = preferred || icons[0].src;
              if (!src) return;
              var apple = document.getElementById('apple-touch-icon');
              if (apple) apple.setAttribute('href', src);
            })
            .catch(function () {});
        }

        var manifest = document.createElement('link');
        manifest.rel = 'manifest';
        manifest.id = 'app-manifest';
        manifest.href = manifestHref;
        document.head.appendChild(manifest);

        var isPwa =
          window.matchMedia('(display-mode: standalone)').matches ||
          window.matchMedia('(display-mode: fullscreen)').matches ||
          window.matchMedia('(display-mode: minimal-ui)').matches ||
          window.navigator.standalone === true;
        if (!isPwa && !isPublicOrdering) return;
        var meta = document.getElementById('app-viewport');
        if (meta) {
          meta.setAttribute(
            'content',
            'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, interactive-widget=resizes-content',
          );
        }
        if (isPwa) document.documentElement.classList.add('guy-pwa');
        if (isPublicOrdering) document.documentElement.classList.add('guy-public-ordering');
      })();
    </script>
  </head>
  <body>
    <style>
      /* Primer paint PWA: fondo claro + spinner mientras Angular bootea (evita flash negro). */
      html:not([style*='background']),
      body:not([style*='background']) {
        background-color: #f3f6f4;
      }
      body {
        margin: 0;
      }
      app-root:empty {
        display: flex;
        min-height: 100dvh;
        align-items: center;
        justify-content: center;
        background: #f3f6f4;
      }
      app-root:empty::after {
        content: '';
        width: 1.75rem;
        height: 1.75rem;
        border: 2px solid #c5d0cc;
        border-top-color: #0a3d5c;
        border-radius: 50%;
        animation: guy-boot-spin 0.7s linear infinite;
      }
      @keyframes guy-boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <app-root></app-root>
    <noscript>Habilitá JavaScript para continuar usando Cierres de caja.</noscript>
  </body>
</html>
