<div class="layout-root" [class.layout-root--mobile]="isMobile()">
  <mat-sidenav-container class="layout-container">
    <mat-sidenav
      class="layout-sidenav"
      [class.layout-sidenav--mobile]="isMobile()"
      [mode]="isMobile() ? 'over' : 'side'"
      [opened]="sidenavOpen()"
      [fixedInViewport]="true"
      [fixedTopGap]="0"
      [fixedBottomGap]="0"
      (openedChange)="onSidenavOpenedChange($event)"
    >
      <app-sidebar
        [navItems]="navItems()"
        [isMobile]="isMobile()"
        (close)="onSidenavOpenedChange(false)"
        (navigate)="closeSidenavOnNavigate()"
      />
    </mat-sidenav>

    <mat-sidenav-content
      class="layout-shell"
      [class.layout-shell--mobile]="isMobile()"
      [class.sidenav-open]="isMobile() && sidenavOpen()"
    >
      <app-toolbar
        [user]="user()"
        [isMobile]="isMobile()"
        [sidenavOpen]="sidenavOpen()"
        (menuToggle)="toggleSidenav()"
        (logout)="logout()"
      />

      <div class="layout-main-scroll">
        <main
          class="layout-content container-fluid guy-page-enter"
          [class.py-4]="!isCashierLayout()"
          [class.py-2]="isCashierLayout()"
          [class.layout-content--cashier]="isCashierLayout()"
        >
          @if (isMobile() && pageRefresh.hasHandler()) {
            <app-pull-to-refresh
              [enabled]="!sidenavOpen()"
              [disabled]="sidenavOpen()"
              [refreshing]="pageRefresh.refreshing()"
              (refresh)="pageRefresh.refresh()"
            />
          }
          @if (routeLoading()) {
            <div class="route-loading" role="status" aria-live="polite" aria-busy="true">
              <mat-progress-bar mode="indeterminate" class="guy-progress route-loading__bar" />
              <app-loading-state
                [loading]="true"
                title="Cargando…"
                message="Preparando la pantalla"
              />
            </div>
          }
          <div class="route-outlet" [class.route-outlet--hidden]="routeLoading()">
            <router-outlet />
          </div>
        </main>

        <app-main-pwa-install-banner />
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
