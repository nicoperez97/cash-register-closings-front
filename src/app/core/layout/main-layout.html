<div
  class="layout-root"
  [class.layout-root--mobile]="isMobile()"
  [class.layout-root--rail]="!sidenavOverlay() && !isMobile() && !sidenavExpanded()"
  [class.layout-root--chrome-off]="chromeOff()"
>
  <mat-sidenav-container class="layout-container">
    <mat-sidenav
      class="layout-sidenav"
      [class.layout-sidenav--mobile]="sidenavOverlay()"
      [class.layout-sidenav--rail]="!sidenavOverlay() && !isMobile() && !sidenavExpanded()"
      [mode]="sidenavOverlay() ? 'over' : 'side'"
      [opened]="sidenavOverlay() ? sidenavOpen() : true"
      [fixedInViewport]="true"
      [fixedTopGap]="0"
      [fixedBottomGap]="0"
      (openedChange)="onSidenavOpenedChange($event)"
    >
      <app-sidebar
        [navItems]="navItems()"
        [isMobile]="sidenavOverlay()"
        [rail]="!sidenavOverlay() && !isMobile() && !sidenavExpanded()"
        (close)="onSidenavOpenedChange(false)"
        (navigate)="closeSidenavOnNavigate()"
        (expandRequest)="expandSidenav()"
        (railToggle)="toggleSidenav()"
      />
    </mat-sidenav>

    <mat-sidenav-content
      class="layout-shell"
      [class.layout-shell--mobile]="isMobile()"
      [class.sidenav-open]="isMobile() && sidenavOpen()"
    >
      @if (!hideMainToolbar()) {
        <app-toolbar
          [user]="user()"
          [isMobile]="isMobile()"
          [sidenavOpen]="isMobile() ? sidenavOpen() : sidenavExpanded()"
          (menuToggle)="toggleSidenav()"
          (logout)="logout()"
        />
      }

      <div
        class="layout-main-scroll"
        [class.layout-main-scroll--immersive]="isPublicPageViewer()"
        [class.layout-main-scroll--chrome-off]="showChromeReveal()"
      >
        <main
          class="layout-content container-fluid guy-page-enter"
          [class.py-4]="!isCashierLayout() && !hideMainToolbar()"
          [class.py-2]="isCashierLayout() || chromeOff()"
          [class.layout-content--cashier]="isCashierLayout()"
          [class.layout-content--immersive]="isPublicPageViewer()"
        >
          @if (isMobile() && pageRefresh.hasHandler()) {
            <app-pull-to-refresh
              [enabled]="!sidenavOpen()"
              [disabled]="sidenavOpen()"
              [refreshing]="pageRefresh.refreshing()"
              (refresh)="pageRefresh.refresh()"
            />
          }
          @if (routeLoading()) {
            <div class="route-loading" role="status" aria-live="polite" aria-busy="true">
              <mat-progress-bar mode="indeterminate" class="guy-progress route-loading__bar" />
            </div>
          }
          <div class="route-outlet" [class.route-outlet--dimmed]="routeLoading()">
            <router-outlet />
          </div>
        </main>

        @if (!hideMainToolbar()) {
          <app-main-pwa-install-banner />
        }
      </div>
    </mat-sidenav-content>
  </mat-sidenav-container>

  @if (showChromeReveal()) {
    <div class="chrome-reveal" aria-label="Controles de pantalla">
      <div class="chrome-reveal__dock">
        <button
          type="button"
          class="chrome-reveal__btn"
          matTooltip="Menú"
          aria-label="Menú"
          (click)="toggleSidenav()"
        >
          <mat-icon>menu</mat-icon>
          <span>Menú</span>
        </button>
        <button
          type="button"
          class="chrome-reveal__btn"
          matTooltip="Mostrar barra"
          aria-label="Mostrar barra"
          (click)="immersiveChrome.setToolbarHidden(false)"
        >
          <mat-icon>unfold_more</mat-icon>
          <span>Barra</span>
        </button>
      </div>
    </div>
  }
</div>
