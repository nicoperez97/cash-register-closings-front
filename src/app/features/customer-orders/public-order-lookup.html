<div class="page">
  <app-public-page-install-banner kind="orderLookup" [accent]="accent()" />
  <header class="hero">
    <p class="brand">Pedidos online</p>
    <h1>¿Cómo va tu pedido?</h1>
    <p class="lead">Ingresá el celular. El código es opcional si lo tenés a mano.</p>
  </header>

  <form class="card" (submit)="search($event)">
    <label>
      Celular
      <input
        type="tel"
        [(ngModel)]="phone"
        name="phone"
        required
        autocomplete="tel"
        inputmode="tel"
        placeholder="11 2345 6789"
      />
    </label>
    <label>
      Código <span class="optional">(opcional)</span>
      <input
        type="text"
        [(ngModel)]="code"
        name="code"
        autocomplete="off"
        maxlength="12"
        placeholder="Ej: A3K9"
        class="code"
      />
    </label>
    @if (error()) {
      <p class="form-error">{{ error() }}</p>
    }
    <button type="submit" [disabled]="loading() || !phone.trim()">
      {{ loading() ? 'Buscando…' : 'Ver pedido' }}
    </button>
  </form>

  <p class="back">
    <a [routerLink]="['/pedir', slug()]">Volver a pedir</a>
  </p>
</div>
